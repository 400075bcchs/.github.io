<!DOCTYPE html>
<html>
  <head>
    <title>Color Scheme Assignment</title>
  </head>
  <body>
    <h1>Color Scheme Assignment</h1>
    <img src="photo.jpg" alt="Beautiful scenic colorful view of mountain and lake">
    
    <style>
    table, tr, td, th {
      border: 1px solid black;
    }
  </style>
  
  <table>
    <caption>Mountain View</caption>
    <tr>
      <th colspan="4" style="font-family: Verdana, sans-serif;">Mountain and Lake</th>
    </tr>
    
    <tr>
      <th style="background-color:rgb(233,150,122);">Dark Salmon</th>
      <th style="background-color:rgb(47,79,79); color:#FFFFFF;">Dark Slate Gray</th>
      <th style="background-color:rgb(255,215,0);">Gold</th>
      <th style="background-color:rgb(34,139,34);">Forest Green</th>
    </tr>

    <tr>
      <td>HEX: #E9967A</td>
      <td>HEX: #2F4F4F</td>
      <td>HEX: #FFD700</td>
      <td>HEX: #228B22</td>
    </tr>

    <tr>
      <td>RGB: 233,150,122</td>
      <td>RGB: 47,79,79</td>
      <td>RGB: 255,215,0</td>
      <td>RGB: 34,139,34</td>
    </tr>

    <tr>
      <td>HSL: 15,72%,78%</td>
      <td>HSL: 180,25%,25%</td>
      <td>HSL: 51,100%,50%</td>
      <td>HSL: 120,61%,34%</td>
    </tr>
  </table>
  </body>
</html>

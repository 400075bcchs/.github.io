<!DOCTYPE html>
<html>
  <head>
    <title>The Imitation Assignment</title>
    <link rel="stylesheet" href="imitationstyle.css">
  </head>

  <body>

    <header class="showcase-header">
      <h1>The Imitation Assignment</h1>
      <p>Designing and imitating images.</p>
    </header>

    <main class="showcase-grid">

      <!-- Penguin -->
      <section class="component-card">
        <h2>1. Penguin with Oval Frame</h2>
        <div class="oval-container">
          <img src="penguins.jpg" alt="Picture of 8 penguins">
        </div>
      </section>

      <!-- Football and Tic-Tac-Toe -->
      <section class="component-card">
        <h2>2. Football Field with Tic-Tac-Toe Border</h2>
        <div class="tictactoe-border-bg">
          <img src="football-field.png" alt="Football field with tic-tac-toe border" class="center-field-img">
        </div>
      </section>

      <!-- Dinosaur -->
      <section class="component-card">
        <h2>3. Blue Dinosaur with Drop Shadow</h2>
        <div class="dino-container">
          <img src="dinosaur.png" alt="Blue dinosaur with shadow" class="dino-blue">
        </div>
      </section>

      <!-- Seagull -->
      <section class="component-card">
        <h2>4. Seagull with Blue Gradient Sky</h2>
        <div class="photo-frame">
          <div class="sky-canvas">
            <img src="seagull.png" alt="Seagull flying with blue gradient sky">
          </div>
        </div>
      </section>

      <!-- Theater -->
      <section class="component-card">
        <h2>5. Theater Stage with Text</h2>
        <div class="stage-container">
          <img src="theater_stage.jpg" alt="Theater stage with text saying Presenting">
          <div class="overlay-text">Presenting</div>
        </div>
      </section>

    </main>

  </body>
  
</html>

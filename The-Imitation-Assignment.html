<!DOCTYPE html>
<html>
  <head>
    <title>The Imitation Assignment</title>
    <link rel="stylesheet" href="imitationstyle.css">
  </head>

  <body>

    <h1>The Imitation Assignment<h1>

    <div class="gallery-grid">

      <!-- Penguins -->
      <div class="card">
        <h3>1. Penguins with Oval Frame and Vintage Filter</h3>
        <div class="oval-container">
          <img src="penguins.jpg" alt="Eight penguins with oval frame and sepia filter" class="oval-image">
        </div>
      </div>
    
      <!-- Football Field and Tic-Tac-Toe Frame -->
      <div class="card">
        <h3>2. Grayscale Football Field with Tic-Tac-Toe Border</h3>
        <div class="tictactoe-card">
          <img src="football_field.jpg" alt="Gray football field with tic-tac-toe border">
        </div>
      </div>

      <!-- Blue Dinosaur -->
      <div class="card">
        <h3>3. Blue Dinosaur with Drop Shadow</h3>
        <div class="dino-card">
          <img src="dinosaur.png" alt="Blue dinosaur with drop shadow" class="blue-dino">
        </div>
      </div>

      <!-- Seagull -->\
      <div class="card">
        <h3>4. Seagull with Gradient Sky</h3>
        <div class="seagull-card">
          <img src="seagull.png" alt="Seagull with blue gradient sky" class="seagull-img">
        </div>
      </div>

      <!-- Butterfly -->
      <div class="card">
        <h3>5. Blue Butterfly with Unique Corners</h3>
        <div class="butterfly-container">
          <img src="butterfly.jpg" alt="Inverted blue butterfly with unique rounded corners" class="styled-butterfly">
        </div>
      </div>

      <!-- Theater -->
      <div class="card">
        <h3>6. Theater with Presenting Text</h3>
        <div class="stage-card">
          <img src="theater_stage.jpg" alt="Stage background with presenting text" class="stage-img">
          <div class="overlay-text">Presenting</div>
        </div>
      </div>

    </div>
    
  </body>
  
</html>
